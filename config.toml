baseURL = "https://bchen.net/"
theme = "bchen" # previous theme: "hugo-apero" (still in themes/; switch back here)
languageCode = "en"
title = "Bodong Chen"
author = "Bodong Chen"
copyright = "" # set to override the auto generated copyright using org info and now year
googleAnalytics = "G-GRKJN0JFNZ"
disqusShortname = "meefen" # see params.utterances to use utterances instead of Disqus
# set deliberately low for testing choose your preffered number based on the blog layout you've chosen
paginate = 5
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
enableEmoji = true

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "1h"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true  # Enable user to embed HTML snippets in Markdown content.
    hardwraps = false 
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    # one of: https://xyproto.github.io/splash/docs/ 
    style = "github"
    
[params]
  # bchen theme
  tagline = "Learning Sciences & Technologies, Penn GSE"
  portrait = "/img/bodong-chen-portrait.jpg"
  avatar = "/img/bodong-chen-avatar.jpg"
  footer_note = "University of Pennsylvania"

  # hugo-apero (kept for rollback)
  orgName = "Bodong Chen"
  # orgLocal = "Anywhere"
  description = "Personal website"
  favicon = "/img/logo_48_ico.png"
  logo = "/img/logo_480.png"
  mainSections = ["blog", "project", "talk", "publication", "zh"]
  yearlySections = ["talk", "publication"]
  navallcaps = true
  # show/hide social icons in site header & footer
  # configure social icons and links below in [[params.social]]
  socialInHeader = false
  socialInFooter = true
  # Default image for social sharing and search engines. 
  # Place image file in `static` folder and specify image name here.
  sharing_image = "/img/papillons.jpg"
  # Twitter username (without @). Used when a visitor shares your site on Twitter.
  twitter = "bod0ng"
  
  # use a built-in color theme
  # one of: forest / grayscale / peach / plum /
  #         poppy / sky / violet / water 
  # theme = "sky"  # takes precedence over custom_theme when set


  # or, leave theme empty & make your own palette
  # see docs at https://hugo-apero.netlify.app/blog/color-themes/
  # the custom scss file must be in the assets/ folder
  # add the filename name here, without extension
  # to use hex colors instead of named tachyons colors, include "hex" in filename
  custom_theme = "hex-colors" 
  
  # use an embedded font-family
  # serif options: Fraunces / EB Garamond / Bitter
  # sans-serif options: Commissioner / Atkinson Hyperlegible / Metropolis
  # if you import your own fonts, name them here too
  customtextFontFamily = ""
  customheadingFontFamily = ""
  # alternatively, leave empty and select basic font options: sans-serif or serif
  # for more http://tachyons.io/docs/typography/font-family/
  textFontFamily = "Atkinson Hyperlegible, sans-serif"
  headingFontFamily = "EB Garamond, Georgia, serif"

  # Substack posts are listed under Essays (fetched at build time)
  [params.substack]
    url = "https://bodong.substack.com/"
    feed = "https://bodong.substack.com/feed"

  # Configuration of https://utteranc.es/ for comments
  [params.utterances]
    use_utterances = false
    repo_name = "apreshill/apero"
    issue_term = "pathname" # url, pathname, or title
    theme = "boxy-light"
    label = "comments :crystal_ball:"

  # Configuration of math rendering
  [params.math]
    renderer = "katex" # one of "mathjax" / "katex" 

  # Social icons may appear on homepage and in site header or footer
  # Configure show/hide above - add as many as you like below
  # Icon pack "fab" includes brand icons, see: https://fontawesome.com/icons?d=gallery&s=brands&m=free
  # Icon pack "fas" includes solid icons, see: https://fontawesome.com/icons?d=gallery&s=solid&m=free
  # Icon pack "far" includes regular icons, see: https://fontawesome.com/icons?d=gallery&s=regular&m=free
  [[params.social]]
      icon      = "google-scholar" # icon name without the 'fa-'
      icon_pack = "ai"
      url       = "https://scholar.google.com/citations?user=BWrZE-MAAAAJ&hl=en"
  [[params.social]]
      icon      = "twitter" # icon name without the 'fa-'
      icon_pack = "fab"
      url       = "https://twitter.com/bod0ng"
  [[params.social]]
      icon      = "orcid" # icon name without the 'fa-'
      icon_pack = "ai"
      url       = "https://orcid.org/0000-0003-4616-4353"
  [[params.social]]
      icon      = "rss" # icon name without the 'fa-'
      icon_pack = "fas"
      url       = "/blog/index.xml"


[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[menu]
  # Main navigation
  [[menu.header]]
    name = "About"
    url = "/about/"
    weight = 1
  [[menu.header]]
    name = "Essays"
    url = "/blog/"
    weight = 2
  [[menu.header]]
    name = "Talks"
    url = "/talk/"
    weight = 3
  [[menu.header]]
    name = "Publications"
    url = "/publication/"
    weight = 4
  [[menu.header]]
    name = "Teaching"
    url = "/teaching/"
    weight = 5

  # Footer links
  [[menu.footer]]
    name = "Google Scholar"
    url = "https://scholar.google.com/citations?user=BWrZE-MAAAAJ&hl=en"
    weight = 1
  [[menu.footer]]
    name = "ORCID"
    url = "https://orcid.org/0000-0003-4616-4353"
    weight = 2
  [[menu.footer]]
    name = "GitHub"
    url = "https://github.com/meefen"
    weight = 3
  [[menu.footer]]
    name = "RSS"
    url = "/blog/index.xml"
    weight = 4
  [[menu.footer]]
    name = "CV"
    url = "/file/cv.html"
    weight = 5
  [[menu.footer]]
    name = "Contact"
    url = "/contact/"
    weight = 6
